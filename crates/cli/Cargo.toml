[package]
name = "chibi"
description = "A local Ethereum JSON-RPC endpoint for browser wallets, backed by a partial-state node that verifies everything it serves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "chibi"
path = "src/main.rs"

[dependencies]
chibi-core.workspace = true
chibi-node.workspace = true

alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rpc-types-eth.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
eyre.workspace = true
clap.workspace = true
jsonrpsee.workspace = true
tower.workspace = true
tower-http.workspace = true
http = "1.3"
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
chibi-core = { workspace = true, features = ["test-utils"] }
chibi-node = { workspace = true, features = ["test-utils"] }
alloy-signer = "2.5"
alloy-signer-local = "2.5"
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
revm.workspace = true
