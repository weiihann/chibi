[workspace]
resolver = "3"
members = ["crates/core", "crates/node", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
wildcard_enum_match_arm = "warn"
uninlined_format_args = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
chibi-core = { path = "crates/core" }
chibi-node = { path = "crates/node" }

helios-ethereum = { git = "https://github.com/a16z/helios", rev = "68e3d07c7ca7a731334004e461a87b695b451e16" }
helios-core = { git = "https://github.com/a16z/helios", rev = "68e3d07c7ca7a731334004e461a87b695b451e16" }
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "68e3d07c7ca7a731334004e461a87b695b451e16" }

reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-eth-wire-types = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-network = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-network-api = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-network-p2p = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", rev = "7a5c817ab841b8b5ceea6dccb4f100a4d973b9e0" }

revm = { version = "43.0.3", default-features = false, features = [
    "std",
    "optional_eip3607",
    "optional_no_base_fee",
    "optional_fee_charge",
] }
alloy-evm = "0.39.0"
alloy-eip7928 = { version = "0.4.11", features = ["rlp"] }
alloy-primitives = { version = "1.7", features = ["serde", "rlp"] }
alloy-consensus = { version = "2.5", features = ["k256", "serde"] }
alloy-eips = { version = "2.5", features = ["serde"] }
alloy-rlp = "0.3.16"
alloy-trie = "0.9.8"
alloy-rpc-types-eth = { version = "2.5", features = ["serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
toml = "0.8"
url = "2"
eyre = "0.6"
clap = { version = "4", features = ["derive"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tempfile = "3"
proptest = "1"

[patch.crates-io]
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
